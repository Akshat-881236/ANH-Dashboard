/* =========================================
SAVE PROFILE
========================================= */

document
.getElementById(
    "saveProfileBtn"
)
.addEventListener(
    "click",
    async()=>{

        const user =
        auth.currentUser;

        if(!user){

            alert(
                "Authentication Required"
            );

            return;

        }

        const fullName =

        document
        .getElementById(
            "fullName"
        )
        .value
        .trim();

        const email =

        document
        .getElementById(
            "email"
        )
        .value
        .trim();

        const dob =

        document
        .getElementById(
            "dob"
        )
        .value;

        const profileURL =

        document
        .getElementById(
            "profileURL"
        )
        .value
        .trim();

        const whatsapp =

        document
        .getElementById(
            "whatsapp"
        )
        .value
        .trim();

        const profileStatus =

        document
        .getElementById(
            "profileStatus"
        );

        /* =================================
           VALIDATION
        ================================= */

        if(

            !fullName ||

            !email ||

            !dob ||

            !profileURL ||

            !whatsapp

        ){

            profileStatus.innerHTML =

            "All Fields Required";

            profileStatus.className =
            "error";

            return;

        }

        /* =================================
           WHATSAPP VALIDATION
        ================================= */

        const repeatedDigits =

        /^(\d)\1+$/;

        if(

            repeatedDigits.test(
                whatsapp
            )

        ){

            profileStatus.innerHTML =

            "Invalid Whatsapp Number";

            profileStatus.className =
            "error";

            return;

        }

        if(

            whatsapp.length < 10 ||

            whatsapp.length > 13

        ){

            profileStatus.innerHTML =

            "Invalid Whatsapp Length";

            profileStatus.className =
            "error";

            return;

        }

        /* =================================
           IMAGE VALIDATION
        ================================= */

        try{

            const imageCheck =

            await fetch(profileURL);

            if(!imageCheck.ok){

                throw new Error();

            }

        }
        catch{

            profileStatus.innerHTML =

            "Invalid Profile Image URL";

            profileStatus.className =
            "error";

            return;

        }

        /* =================================
           USER ID
        ================================= */

        const generatedUserID =

        Math.floor(

            1000000 +
            Math.random() * 9000000

        );

        /* =================================
           SAVE USER
        ================================= */

        await setDoc(

            doc(
                db,
                "users",
                user.uid
            ),

            {

                user_id:
                generatedUserID,

                uid:
                user.uid,

                full_name:
                fullName,

                email:
                email,

                dob:
                dob,

                profile_photo:
                profileURL,

                whatsapp:
                whatsapp,

                created_at:
                new Date()
                .toISOString()

            }

        );

        profileStatus.innerHTML =

        "Profile Saved Successfully";

        profileStatus.className =
        "success";

        setTimeout(()=>{

            window.location.reload();

        },1200);

    }
);

/* =========================================
VISIT HISTORY
========================================= */

async function loadVisitHistory(){

    const user =
    auth.currentUser;

    if(!user) return;

    const table =
    document.getElementById(
        "visitTable"
    );

    if(!table) return;

    table.innerHTML = "";

    try{

        /* =====================================
           SIMPLE QUERY
        ===================================== */

        const q = query(

            collection(db,"visit_logs"),

            where(
                "uid",
                "==",
                user.uid
            )

        );

        const snapshot =
        await getDocs(q);

        /* =====================================
           LOCAL ARRAY
        ===================================== */

        const logs = [];

        snapshot.forEach(docSnap=>{

            logs.push({

                id:
                docSnap.id,

                ...docSnap.data()

            });

        });

        /* =====================================
           LOCAL SORT
        ===================================== */

        logs.sort((a,b)=>{

            return new Date(
                b.timestamp
            ) -

            new Date(
                a.timestamp
            );

        });

        /* =====================================
           EMPTY CHECK
        ===================================== */

        if(logs.length === 0){

            table.innerHTML = `

                <tr>

                    <td colspan="6">

                        No Visit History Found

                    </td>

                </tr>

            `;

            return;

        }

        /* =====================================
           RENDER
        ===================================== */

        logs.forEach(data=>{

            const current =
            data.current || {};

            const previous =
            data.previous || {};

            const next =
            data.next || {};

            table.innerHTML += `

                <tr>

                    <td>

                        ${current.log_id || "-"}

                    </td>

                    <td>

                        ${current.title || "-"}

                    </td>

                    <td>

                        ${data.diagnostics?.device || "-"}

                    </td>

                    <td>

                        <a
                        href="${previous.url || '#'}"
                        target="_blank">

                            ${previous.title || "Previous"}

                        </a>

                    </td>

                    <td>

                        <a
                        href="${next.url || '#'}"
                        target="_blank">

                            ${next.title || "Next"}

                        </a>

                    </td>

                    <td>

                        <button
                        onclick="openDiagnostic('${data.id}')">

                            Diagnostic

                        </button>

                    </td>

                </tr>

            `;

        });

        console.log(
            "Visit History Loaded"
        );

    }
    catch(error){

        console.error(
            "Visit History Error",
            error
        );

    }

}

/* =========================================================
DOWNLOAD PDF
========================================================= */

document
.getElementById(
    "downloadPDFBtn"
)
.addEventListener(
    "click",
    async()=>{

        /* =====================================
           REMOVE SCROLL LIMIT
        ===================================== */

        const originalMaxHeight =
        card.style.maxHeight;

        const originalOverflow =
        card.style.overflow;

        card.style.maxHeight =
        "none";

        card.style.overflow =
        "visible";

        /* =====================================
           FULL HTML CAPTURE
        ===================================== */

        const canvas =

        await html2canvas(card,{

            scale:2,

            useCORS:true,

            allowTaint:true,

            windowWidth:
            card.scrollWidth,

            windowHeight:
            card.scrollHeight

        });

        /* =====================================
           RESTORE
        ===================================== */

        card.style.maxHeight =
        originalMaxHeight;

        card.style.overflow =
        originalOverflow;

        /* =====================================
           PDF ENGINE
        ===================================== */

        const imageData =

        canvas.toDataURL(
            "image/png"
        );

        const pdf =

        new jspdf.jsPDF(
            "p",
            "mm",
            "a4"
        );

        const pdfWidth =
        190;

        const pdfHeight =

        canvas.height *
        pdfWidth /
        canvas.width;

        /* =====================================
           MULTI PAGE SUPPORT
        ===================================== */

        let heightLeft =
        pdfHeight;

        let position = 0;

        pdf.addImage(

            imageData,

            "PNG",

            10,

            position,

            pdfWidth,

            pdfHeight

        );

        heightLeft -= 277;

        while(heightLeft > 0){

            position =
            heightLeft - pdfHeight;

            pdf.addPage();

            pdf.addImage(

                imageData,

                "PNG",

                10,

                position,

                pdfWidth,

                pdfHeight

            );

            heightLeft -= 277;

        }

        /* =====================================
           DOWNLOAD
        ===================================== */

        pdf.save(

            current.log_id +

            "_diagnostic.pdf"

        );

    });
        }
    catch(error){

        console.error(
            "Diagnostic Error",
            error
        );

        alert(
            "Diagnostic Load Failed"
        );

    }

}
